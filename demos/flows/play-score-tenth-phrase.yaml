id: play-score-tenth-phrase
title: Open Play Score, show the phrases and play the tenth phrase
description: Open Play Score, show the phrases and play the tenth phrase
viewport:
  width: 1440
  height: 900

# Each tap is cued: an arrow pointing at the control the action lands on, and a `thud`
# the moment it lands — so a press reads on the video. See demos/README.md.
democlip:
  actionCues: true

steps:
  - action: click
    selector: '[data-testid="plugin-launch-play-score"]'
    caption: Open the Play Score plugin.
    hold: 900
  - action: waitFor
    selector: '[data-testid="score-selector-dialog"]'
    caption: Choose a piece — Burgmüller's Arabesque.
  - action: click
    selector: '[data-testid="score-selector-item-burgmuller-arabesque"]'
  - action: waitFor
    selector: '[role="toolbar"]'
  - action: waitForFunction
    script: document.querySelectorAll('svg line, svg path').length > 40
    timeout: 30000
  - action: click
    selector: '[data-testid="score-phrases-toggle"]'
    caption: Show the phrases.
    hold: 1200
  - action: click
    selector: '[data-testid="score-phrases-next"]'
    caption: Step to the tenth phrase.
    hold: 250
  - action: click
    selector: '[data-testid="score-phrases-next"]'
    hold: 250
  - action: click
    selector: '[data-testid="score-phrases-next"]'
    hold: 250
  - action: click
    selector: '[data-testid="score-phrases-next"]'
    hold: 250
  - action: click
    selector: '[data-testid="score-phrases-next"]'
    hold: 250
  - action: click
    selector: '[data-testid="score-phrases-next"]'
    hold: 250
  - action: click
    selector: '[data-testid="score-phrases-next"]'
    hold: 250
  - action: click
    selector: '[data-testid="score-phrases-next"]'
    hold: 250
  - action: click
    selector: '[data-testid="score-phrases-next"]'
    hold: 250
  - action: click
    selector: '[data-testid="score-phrases-next"]'
    hold: 1200
  - action: click
    selector: '[data-testid="play-score-play"]'
    caption: Press ▶ Play to reproduce the tenth phrase.
    hold: 5000
audience: first-time user
