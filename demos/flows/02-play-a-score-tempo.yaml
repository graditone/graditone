# DemoClip source flow: Play a Score — Change the Tempo
#
# A flow is data. This file is the single source of truth for the video, its
# title and its description — the runner turns it into a video, and a catalog
# page can be generated from the same file. See demos/README.md.
#
# Based on 01-play-a-score.yaml: the same path into the Play Score plugin, but
# once the music is playing it shows how the tempo control changes the playback
# speed — a tap for 1 BPM, a hold for 5 BPM steps.

id: play-a-score-tempo
title: Play a Score — Change the Tempo
audience: first-time user
description: >
  Open the Play Score plugin, start a piece and change the playback tempo while
  it plays: tap + or − for one BPM at a time, or hold either button to speed up
  or slow down in 5 BPM steps. The BPM readout and the page scroll follow the
  music in real time.

# The demos are aimed at a tablet, since Graditone is tablet-native.
viewport: { width: 1440, height: 900 }

steps:
  - caption: "Graditone opens on a shelf of plugins. Let's hear a piece."
    hold: 1200

  - caption: "Tap Play Score."
    action: click
    selector: '[data-testid="plugin-launch-play-score"]'
    hold: 700

  - action: waitFor
    selector: '[data-testid="score-selector-dialog"]'

  - caption: "Choose a piece — Beethoven's Für Elise."
    action: click
    selector: '.score-selector-item__btn:has-text("Für Elise")'

  - action: waitFor
    selector: '[role="toolbar"]'

  # Wait for the WASM engine to parse and engrave the score.
  - action: waitForFunction
    script: "document.querySelectorAll('svg line, svg path').length > 40"
    timeout: 30000
    hold: 1200

  - caption: "Press ▶ Play."
    action: click
    selector: '[role="toolbar"] [aria-label="Play"]'
    hold: 3500

  # Short taps: one BPM per tap. Repeat a few times so the readout visibly moves.
  - caption: "Tap + to nudge the tempo up — one BPM per tap."
    action: click
    selector: '[role="toolbar"] [aria-label="Increase tempo"]'
    hold: 250

  - action: click
    selector: '[role="toolbar"] [aria-label="Increase tempo"]'
    hold: 250

  - action: click
    selector: '[role="toolbar"] [aria-label="Increase tempo"]'
    hold: 250

  - action: click
    selector: '[role="toolbar"] [aria-label="Increase tempo"]'
    hold: 250

  - action: click
    selector: '[role="toolbar"] [aria-label="Increase tempo"]'
    hold: 1200

  # Hold to repeat: after one second the control steps by 5 BPM every 300 ms.
  - caption: "Hold + to speed up quickly — each repeat adds 5 BPM."
    action: click
    selector: '[role="toolbar"] [aria-label="Increase tempo"]'
    pressMs: 2500
    hold: 3000

  - caption: "The music plays faster — the BPM readout and the page scroll keep up."
    hold: 3000

  - caption: "Hold − to slow the playback back down."
    action: click
    selector: '[role="toolbar"] [aria-label="Decrease tempo"]'
    pressMs: 2500
    hold: 3000

  - caption: "Tap − for 1 BPM steps, or hold it to slow down faster."
    action: click
    selector: '[role="toolbar"] [aria-label="Decrease tempo"]'
    hold: 250

  - action: click
    selector: '[role="toolbar"] [aria-label="Decrease tempo"]'
    hold: 250

  - action: click
    selector: '[role="toolbar"] [aria-label="Decrease tempo"]'
    hold: 1200

  - caption: "Press ■ Stop when you're done."
    action: click
    selector: '[role="toolbar"] [aria-label="Stop"]'
    hold: 1500
