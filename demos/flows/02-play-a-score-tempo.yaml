# DemoClip source flow: Play a Score — Change the Tempo
#
# A flow is data. This file is the single source of truth for the video, its
# title and its description — the runner turns it into a video, and a catalog
# page can be generated from the same file. See demos/README.md.
#
# Based on 01-play-a-score.yaml, but it drives the shared tempo control: hold −
# down to 80 BPM, then hold + up to 180 BPM. Graditone locks in the new tempo
# when playback starts, so the flow stops and replays the piece after each
# change — that is where the faster/slower music is actually heard.

id: play-a-score-tempo
title: Play a Score — Change the Tempo
audience: first-time user
description: >
  Open the Play Score plugin, start a piece and change the playback tempo with
  the − / + steppers: hold − to slow the piece to 80 BPM, then hold + to push it
  to 180 BPM. Graditone applies the new tempo when you press ▶ Play again, so
  the piece is stopped and replayed at each tempo — the BPM readout and the page
  scroll follow the music in real time.

# The demos are aimed at a tablet, since Graditone is tablet-native.
viewport: { width: 1440, height: 900 }

steps:
  - caption: "Graditone opens on a shelf of plugins. Let's hear a piece."
    hold: 1200

  - caption: "Tap Play Score."
    action: click
    selector: '[data-testid="plugin-launch-play-score"]'
    hold: 700

  - action: waitFor
    selector: '[data-testid="score-selector-dialog"]'

  - caption: "Choose a piece — Beethoven's Für Elise."
    action: click
    selector: '.score-selector-item__btn:has-text("Für Elise")'

  - action: waitFor
    selector: '[role="toolbar"]'

  # Wait for the WASM engine to parse and engrave the score.
  - action: waitForFunction
    script: "document.querySelectorAll('svg line, svg path').length > 40"
    timeout: 30000
    hold: 1200

  - caption: "Press ▶ Play — the piece starts at its original tempo."
    action: click
    selector: '[role="toolbar"] [aria-label="Play"]'
    hold: 3500

  # Hold − until the BPM readout reaches 80. The control steps by 5 BPM every
  # 300 ms while held, so the readout counts 115, 110 … 80.
  - caption: "Hold − to slow it down — the tempo counts to 80 BPM."
    action: holdUntil
    selector: '[role="toolbar"] [aria-label="Decrease tempo"]'
    script: "parseInt(document.querySelector('[data-testid=\"tempo-display\"]')?.textContent ?? '0', 10) <= 80"
    timeout: 20000
    hold: 900

  # The new tempo is heard on the next Play, so stop and replay.
  - caption: "Press ■ Stop, then ▶ Play to hear 80 BPM."
    action: click
    selector: '[role="toolbar"] [aria-label="Stop"]'
    hold: 700

  - action: click
    selector: '[role="toolbar"] [aria-label="Play"]'
    hold: 5000

  # Hold + until the BPM readout reaches 180.
  - caption: "Hold + to speed it up — this time to 180 BPM."
    action: holdUntil
    selector: '[role="toolbar"] [aria-label="Increase tempo"]'
    script: "parseInt(document.querySelector('[data-testid=\"tempo-display\"]')?.textContent ?? '0', 10) >= 180"
    timeout: 25000
    hold: 900

  - caption: "Press ■ Stop, then ▶ Play to hear 180 BPM."
    action: click
    selector: '[role="toolbar"] [aria-label="Stop"]'
    hold: 700

  - action: click
    selector: '[role="toolbar"] [aria-label="Play"]'
    hold: 5000

  - caption: "Press ■ Stop when you're done."
    action: click
    selector: '[role="toolbar"] [aria-label="Stop"]'
    hold: 1500
