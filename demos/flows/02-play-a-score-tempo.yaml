id: play-a-score-tempo
title: Open Play Score, choose Für Elise, start playback and change…
description: Open Play Score, choose Für Elise, start playback and change the tempo while it plays
viewport:
  width: 1440
  height: 900
steps:
  - action: click
    selector: '[data-testid="plugin-launch-play-score"]'
    caption: Graditone opens on a shelf of plugins. Let's hear a piece.
    hold: 1200
  - action: waitFor
    selector: '[data-testid="score-selector-dialog"]'
    caption: Choose a piece — Beethoven's Für Elise.
  - action: click
    selector: '[data-testid="score-selector-item-beethoven-fur-elise"]'
  - action: waitFor
    selector: '[role="toolbar"]'
  - action: waitForFunction
    script: document.querySelectorAll('svg line, svg path').length > 40
    timeout: 30000
  - action: click
    selector: '[data-testid="play-score-play"]'
    caption: Press ▶ Play.
    hold: 3500
  - action: click
    selector: '[data-testid="tempo-plus"]'
    caption: Tap + to nudge the tempo up — one BPM per tap.
    hold: 250
  - action: click
    selector: '[data-testid="tempo-plus"]'
    hold: 250
  - action: click
    selector: '[data-testid="tempo-plus"]'
    hold: 250
  - action: click
    selector: '[data-testid="tempo-plus"]'
    hold: 250
  - action: click
    selector: '[data-testid="tempo-plus"]'
    hold: 1200
  - action: click
    selector: '[data-testid="tempo-plus"]'
    caption: Hold + to speed up quickly — each repeat adds 5 BPM.
    hold: 3000
    pressMs: 2500
  - action: click
    selector: '[data-testid="tempo-minus"]'
    caption: Hold − to slow the playback back down.
    hold: 3000
    pressMs: 2500
  - action: click
    selector: '[data-testid="tempo-minus"]'
    caption: Tap − for 1 BPM steps, or hold it to slow down faster.
    hold: 250
  - action: click
    selector: '[data-testid="tempo-minus"]'
    hold: 250
  - action: click
    selector: '[data-testid="tempo-minus"]'
    hold: 1200
  - action: click
    selector: '[data-testid="play-score-stop"]'
    caption: Press ■ Stop when you're done.
    hold: 1500
audience: first-time user
