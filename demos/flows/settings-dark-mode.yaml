id: settings-dark-mode
title: Open Play Score and open the display settings to enable dark…
description: Open Play Score and open the display settings to enable dark mode
viewport:
  width: 1440
  height: 900

# Each tap is cued: an arrow pointing at the control the action lands on, and a `thud`
# the moment it lands — so a press reads on the video. See demos/README.md.
democlip:
  actionCues: true

steps:
  - action: click
    selector: '[data-testid="plugin-launch-play-score"]'
    caption: Open the Play Score plugin.
    hold: 700
